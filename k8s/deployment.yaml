apiVersion: apps/v1
kind: Deployment
metadata:
  name: costlens-backend
  namespace: default
  labels:
    app: costlens-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: costlens-backend
  template:
    metadata:
      labels:
        app: costlens-backend
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: costlens-backend-sa
      containers:
        - name: costlens-backend
          image: ghcr.io/shri-hari27/costlens-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: STORAGE_ACCOUNT_NAME
              value: "costlensstfrm34u"
            - name: AZURE_CLIENT_ID
              value: "8aba5959-dcc3-44b5-a008-688cd50210c8"
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
